<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#57606a"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#cf222e"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#059669"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="760" height="640" rx="12" fill="#f7f8fa"/>

  <!-- Tool Call -->
  <g filter="url(#sh)">
    <rect x="130" y="20" width="240" height="44" rx="12" fill="#ffffff" stroke="#8b949e" stroke-width="1.5"/>
    <text x="250" y="48" text-anchor="middle" fill="#1f2328" font-size="13" font-weight="bold">Tool Call</text>
  </g>
  <line x1="250" y1="64" x2="250" y2="84" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 1 -->
  <g filter="url(#sh)">
    <rect x="130" y="86" width="240" height="44" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.4"/>
    <text x="250" y="114" text-anchor="middle" fill="#6f42c1" font-size="12.5" font-weight="bold">1 · 按名称查找 Tool</text>
  </g>
  <line x1="250" y1="130" x2="250" y2="150" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 2 -->
  <g filter="url(#sh)">
    <rect x="130" y="152" width="240" height="44" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.4"/>
    <text x="250" y="180" text-anchor="middle" fill="#6f42c1" font-size="12.5" font-weight="bold">2 · prepareArguments 参数预处理</text>
  </g>
  <line x1="250" y1="196" x2="250" y2="216" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 3 -->
  <g filter="url(#sh)">
    <rect x="130" y="218" width="240" height="44" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.4"/>
    <text x="250" y="246" text-anchor="middle" fill="#6f42c1" font-size="12.5" font-weight="bold">3 · TypeBox Schema 校验参数</text>
  </g>
  <line x1="250" y1="262" x2="250" y2="282" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 4 -->
  <g filter="url(#sh)">
    <rect x="130" y="284" width="240" height="44" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.4"/>
    <text x="250" y="312" text-anchor="middle" fill="#6f42c1" font-size="12.5" font-weight="bold">4 · beforeToolCall hook</text>
  </g>
  <line x1="250" y1="328" x2="250" y2="348" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 5 -->
  <g filter="url(#sh)">
    <rect x="130" y="350" width="240" height="44" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.4"/>
    <text x="250" y="378" text-anchor="middle" fill="#6f42c1" font-size="12.5" font-weight="bold">5 · 调用 execute()</text>
  </g>
  <line x1="250" y1="394" x2="250" y2="414" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 6 -->
  <g filter="url(#sh)">
    <rect x="130" y="416" width="240" height="44" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.4"/>
    <text x="250" y="444" text-anchor="middle" fill="#6f42c1" font-size="12.5" font-weight="bold">6 · afterToolCall hook</text>
  </g>
  <line x1="250" y1="460" x2="250" y2="480" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 7 -->
  <g filter="url(#sh)">
    <rect x="130" y="482" width="240" height="44" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.4"/>
    <text x="250" y="510" text-anchor="middle" fill="#6f42c1" font-size="12.5" font-weight="bold">7 · 生成 Tool Result</text>
  </g>
  <line x1="250" y1="526" x2="250" y2="556" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 进入下一推理步骤 -->
  <g filter="url(#sh)">
    <rect x="150" y="558" width="200" height="48" rx="12" fill="#edf7f0" stroke="#059669" stroke-width="1.5"/>
    <text x="250" y="588" text-anchor="middle" fill="#059669" font-size="13" font-weight="bold">进入下一推理步骤</text>
  </g>

  <!-- 错误分支 -->
  <g filter="url(#sh)">
    <rect x="460" y="270" width="230" height="64" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
    <text x="575" y="296" text-anchor="middle" fill="#cf222e" font-size="12.5" font-weight="bold">isError: true 的 Tool Result</text>
    <text x="575" y="316" text-anchor="middle" fill="#cf222e" font-size="10.5">回灌模型，供其修正或换方案</text>
  </g>
  <line x1="370" y1="240" x2="456" y2="285" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arR)"/>
  <text x="392" y="252" fill="#cf222e" font-size="10.5">校验失败</text>
  <line x1="370" y1="372" x2="456" y2="318" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arR)"/>
  <text x="392" y="360" fill="#cf222e" font-size="10.5">抛 ToolError</text>
  <path d="M 575 334 L 575 582 L 354 582" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arR)"/>
</svg>
