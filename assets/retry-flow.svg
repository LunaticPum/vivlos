<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#57606a"/></marker>
    <marker id="arP" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#8250df"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#059669"/></marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#cf222e"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="340" rx="12" fill="#f7f8fa"/>

  <!-- Row 1: 重试准备 -->
  <g filter="url(#sh)">
    <rect x="20" y="70" width="135" height="54" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
    <text x="87" y="93" text-anchor="middle" fill="#cf222e" font-size="12" font-weight="bold">Provider</text>
    <text x="87" y="110" text-anchor="middle" fill="#cf222e" font-size="12" font-weight="bold">瞬时失败</text>
  </g>
  <line x1="155" y1="97" x2="182" y2="97" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>

  <g filter="url(#sh)">
    <rect x="185" y="70" width="155" height="54" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.4"/>
    <text x="262" y="92" text-anchor="middle" fill="#6f42c1" font-size="12" font-weight="bold">保留已完成的</text>
    <text x="262" y="109" text-anchor="middle" fill="#6f42c1" font-size="12" font-weight="bold">assistant 与 Tool 进展</text>
  </g>
  <line x1="340" y1="97" x2="367" y2="97" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <g filter="url(#sh)">
    <rect x="370" y="70" width="155" height="54" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.4"/>
    <text x="447" y="92" text-anchor="middle" fill="#6f42c1" font-size="12" font-weight="bold">删除失败的</text>
    <text x="447" y="109" text-anchor="middle" fill="#6f42c1" font-size="12" font-weight="bold">terminal assistant</text>
  </g>
  <line x1="525" y1="97" x2="552" y2="97" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <g filter="url(#sh)">
    <rect x="555" y="70" width="135" height="54" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.4"/>
    <text x="622" y="92" text-anchor="middle" fill="#6f42c1" font-size="12" font-weight="bold">按指数退避</text>
    <text x="622" y="109" text-anchor="middle" fill="#6f42c1" font-size="12" font-weight="bold">等待</text>
  </g>
  <line x1="690" y1="97" x2="712" y2="97" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <g filter="url(#sh)">
    <rect x="715" y="70" width="225" height="54" rx="10" fill="#f6f1fb" stroke="#8250df" stroke-width="1.5"/>
    <text x="827" y="92" text-anchor="middle" fill="#6f42c1" font-size="12.5" font-weight="bold">agentLoopContinue()</text>
    <text x="827" y="109" text-anchor="middle" fill="#8b949e" font-size="10.5">从稳定上下文继续</text>
  </g>

  <!-- 下探到判断 -->
  <line x1="827" y1="124" x2="827" y2="184" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 判断 -->
  <g filter="url(#sh)">
    <polygon points="827,186 879,220 827,254 775,220" fill="#eef4fc" stroke="#0969da" stroke-width="1.5"/>
    <text x="827" y="225" text-anchor="middle" fill="#0969da" font-size="12" font-weight="bold">成功?</text>
  </g>

  <!-- 是 → 继续本 Turn -->
  <line x1="800" y1="245" x2="716" y2="272" stroke="#059669" stroke-width="1.8" marker-end="url(#arG)"/>
  <text x="742" y="250" fill="#059669" font-size="11" font-weight="bold">是</text>
  <g filter="url(#sh)">
    <rect x="600" y="272" width="130" height="48" rx="12" fill="#edf7f0" stroke="#059669" stroke-width="1.5"/>
    <text x="665" y="302" text-anchor="middle" fill="#059669" font-size="13" font-weight="bold">继续本 Turn</text>
  </g>

  <!-- 否·超出 → agent:error -->
  <line x1="862" y1="245" x2="886" y2="270" stroke="#cf222e" stroke-width="1.6" marker-end="url(#arR)"/>
  <text x="880" y="252" fill="#cf222e" font-size="10.5">否·超出重试上限</text>
  <g filter="url(#sh)">
    <rect x="838" y="272" width="105" height="48" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
    <text x="890" y="302" text-anchor="middle" fill="#cf222e" font-size="12.5" font-weight="bold">agent:error</text>
  </g>

  <!-- 否·未超 → 回到"保留进展"（重试循环） -->
  <path d="M 775 220 L 262 220 L 262 128" fill="none" stroke="#8250df" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arP)"/>
  <text x="300" y="214" fill="#8250df" font-size="11.5" font-weight="bold">否 · 未超重试上限（循环重试）</text>
</svg>
