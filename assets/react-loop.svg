<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#57606a"/></marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#059669"/></marker>
    <marker id="arP" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#8250df"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="920" height="320" rx="12" fill="#f7f8fa"/>

  <!-- 用户输入 -->
  <g filter="url(#sh)">
    <rect x="24" y="84" width="100" height="52" rx="12" fill="#ffffff" stroke="#8b949e" stroke-width="1.4"/>
    <text x="74" y="115" text-anchor="middle" fill="#1f2328" font-size="12.5" font-weight="bold">用户输入</text>
  </g>
  <line x1="124" y1="110" x2="148" y2="110" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- User Turn 开始 -->
  <g filter="url(#sh)">
    <rect x="152" y="84" width="120" height="52" rx="12" fill="#f6f1fb" stroke="#8250df" stroke-width="1.5"/>
    <text x="212" y="115" text-anchor="middle" fill="#6f42c1" font-size="12.5" font-weight="bold">User Turn 开始</text>
  </g>
  <line x1="272" y1="110" x2="298" y2="110" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ReAct Step -->
  <g filter="url(#sh)">
    <rect x="302" y="80" width="150" height="60" rx="12" fill="#f6f1fb" stroke="#8250df" stroke-width="1.8"/>
    <text x="377" y="105" text-anchor="middle" fill="#6f42c1" font-size="13" font-weight="bold">ReAct Step</text>
    <text x="377" y="124" text-anchor="middle" fill="#8b949e" font-size="10.5">一次 assistant response</text>
  </g>
  <line x1="452" y1="110" x2="478" y2="110" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- 判断 -->
  <g filter="url(#sh)">
    <polygon points="545,70 615,110 545,150 475,110" fill="#eef4fc" stroke="#0969da" stroke-width="1.5"/>
    <text x="545" y="104" text-anchor="middle" fill="#0969da" font-size="11.5" font-weight="bold">产生</text>
    <text x="545" y="120" text-anchor="middle" fill="#0969da" font-size="11.5" font-weight="bold">Tool Calls?</text>
  </g>

  <!-- 否 → 最终回复 -->
  <line x1="615" y1="110" x2="648" y2="110" stroke="#059669" stroke-width="1.8" marker-end="url(#arG)"/>
  <text x="631" y="102" text-anchor="middle" fill="#059669" font-size="11" font-weight="bold">否</text>
  <g filter="url(#sh)">
    <rect x="652" y="84" width="110" height="52" rx="12" fill="#edf7f0" stroke="#059669" stroke-width="1.5"/>
    <text x="707" y="115" text-anchor="middle" fill="#059669" font-size="12.5" font-weight="bold">最终回复</text>
  </g>
  <line x1="762" y1="110" x2="786" y2="110" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Turn 结束 -->
  <g filter="url(#sh)">
    <rect x="790" y="80" width="112" height="60" rx="12" fill="#ffffff" stroke="#8b949e" stroke-width="1.4"/>
    <text x="846" y="104" text-anchor="middle" fill="#1f2328" font-size="12" font-weight="bold">Turn 结束</text>
    <text x="846" y="122" text-anchor="middle" fill="#8b949e" font-size="9.5">写入 history.jsonl</text>
  </g>

  <!-- 是 → 执行工具（下方） -->
  <line x1="545" y1="150" x2="545" y2="206" stroke="#0969da" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="557" y="182" fill="#0969da" font-size="11" font-weight="bold">是</text>
  <g filter="url(#sh)">
    <rect x="465" y="210" width="160" height="56" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <text x="545" y="233" text-anchor="middle" fill="#0969da" font-size="12.5" font-weight="bold">执行工具</text>
    <text x="545" y="251" text-anchor="middle" fill="#8b949e" font-size="10.5">生成 Tool Results</text>
  </g>

  <!-- 执行工具 → 回灌上下文 -->
  <line x1="465" y1="238" x2="352" y2="238" stroke="#57606a" stroke-width="1.8" marker-end="url(#ar)"/>
  <g filter="url(#sh)">
    <rect x="192" y="210" width="160" height="56" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <text x="272" y="233" text-anchor="middle" fill="#0969da" font-size="12" font-weight="bold">Tool Results</text>
    <text x="272" y="251" text-anchor="middle" fill="#8b949e" font-size="10.5">回灌上下文</text>
  </g>

  <!-- 回灌 → 回到 ReAct Step（循环） -->
  <path d="M 272 210 C 272 168, 330 158, 372 142" fill="none" stroke="#8250df" stroke-width="1.8" marker-end="url(#arP)"/>
  <text x="250" y="180" fill="#8250df" font-size="11" font-weight="bold">循环</text>

  <text x="460" y="300" text-anchor="middle" fill="#8b949e" font-size="11.5">一个 User Turn = 多个 ReAct Step 的循环，直到出现无工具调用的最终回复</text>
</svg>
